<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+TC:wght@600;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030811;
            font-family: 'Noto Serif TC', 'Cinzel', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Canvas full viewport */
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            cursor: none; /* Custom crosshair in canvas */
        }

        /* Glassmorphism theme styling */
        .glass-panel {
            background: rgba(8, 20, 38, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        .gold-border {
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fff3a1 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tier Card hover glow */
        .tier-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .tier-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: #f39c12;
            box-shadow: 0 12px 25px rgba(243, 156, 18, 0.35);
        }
        .tier-card.selected {
            border-color: #e74c3c;
            background: rgba(192, 57, 43, 0.25);
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.6);
        }

        /* Radial progress bar for skill overlays */
        .cd-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #e74c3c;
            border-radius: 0.5rem;
            font-size: 1.1rem;
        }

        /* Custom animation for pulsating title */
        @keyframes stormPulse {
            0%, 100% { text-shadow: 0 0 20px rgba(52, 152, 219, 0.6), 0 0 40px rgba(212, 175, 55, 0.4); }
            50% { text-shadow: 0 0 35px rgba(231, 76, 60, 0.8), 0 0 60px rgba(241, 196, 15, 0.6); }

        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }

// ==========================================
// 1. PROCEDURAL WEB AUDIO SYNTHESIZER
// ==========================================
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.windNode = null;
        this.windGain = null;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            this.startStormWind();
        } else if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    startStormWind() {
        if (!this.ctx || this.windNode) return;
        // Generate continuous pink/white noise for storm wind
        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            output[i] *= 0.11;
            b6 = white * 0.115926;
        }

        this.windNode = this.ctx.createBufferSource();
        this.windNode.buffer = noiseBuffer;
        this.windNode.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(350, this.ctx.currentTime);

        this.windGain = this.ctx.createGain();
        this.windGain.gain.setValueAtTime(0.12, this.ctx.currentTime);

        this.windNode.connect(filter);
        filter.connect(this.windGain);
        this.windGain.connect(this.ctx.destination);
        this.windNode.start();
    }

    playCannon() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        // Low freq thump + noise burst
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);

        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
    }

    playImpact() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.25);

        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    playSplash() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    }

    playThunder() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(60, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.8);

        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
    }

    playSkill() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.3);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

const audio = new SoundEngine();

// 3. GAME STATE GLOBALS & INPUT HANDLING

let canvas, ctx, miniCanvas, miniCtx;
let selectedTierNumber = 1;
let gameRunning = false;
let gameTime = 0;

let player = null;
let ships = [];
let cannonballs = [];
let particles = [];
let floatingTexts = [];
let rainParticles = [];

let mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };
let keys = {};

// Player stats for match summary
let statsKills = 0;
let statsDamage = 0;
let matchStartTime = 0;

// Setup input listeners
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
    if (gameRunning && player && player.hp > 0) {
        if (e.key === '1') player.useSkill(0);
        if (e.key === '2') player.useSkill(1);
        if (e.key === '3') player.useSkill(2);
        if (e.key.toLowerCase() === 'f' || e.key === ' ') {
            player.fireBroadside();
        }
    }
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
});

window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener('mousedown', e => {
    if (e.button === 0 && gameRunning && player && player.hp > 0) {
        player.fireBroadside();
    }
});


// ==========================================
// 4. SHIP CLASS & PHYSICS MODEL
// ==========================================
class Ship {
    constructor(x, y, team, config, isPlayer = false) {
        this.x = x;
        this.y = y;
        this.team = team; // 'blue' or 'red'
        this.config = config;
        this.isPlayer = isPlayer;

        this.hp = config.hp;
        this.maxHp = config.hp;
        this.angle = team === 'blue' ? 0 : Math.PI; // Heading angle
        this.speed = 0; // Forward speed ONLY (>= 0, NO REVERSING)
        this.vx = 0;
        this.vy = 0;

        this.fireCd = 0;
        this.buffDamage = 1.0;
        this.shieldTimer = 0;
        this.boostTimer = 0;
        this.stealthTimer = 0;
        this.turnBoostTimer = 0;
        this.specialAmmo = null;

        // Skills state setup
        this.skills = config.skills.map(key => ({
            key: key,
            data: SKILLS_DATABASE[key],
            cdTimer: 0
        }));

        // Pitch & Roll ocean wave motion parameters ("跌宕起伏")
        this.waveOffset = Math.random() * 1000;
        this.wavePitch = 0;
        this.waveScale = 1;
        this.sinkingTimer = 0;
    }

    update() {
        if (this.hp <= 0) {
            this.sinkingTimer++;
            this.speed *= 0.95;
            return;
        }

        // Timers decay
        if (this.fireCd > 0) this.fireCd--;
        if (this.shieldTimer > 0) this.shieldTimer--;
        if (this.boostTimer > 0) this.boostTimer--;
        if (this.stealthTimer > 0) this.stealthTimer--;
        if (this.turnBoostTimer > 0) this.turnBoostTimer--;
        this.skills.forEach(s => { if (s.cdTimer > 0) s.cdTimer--; });

        // Steering & Control
        if (this.isPlayer) {
            this.handlePlayerControls();
        } else {
            this.handleAIControls();
        }

        // STRICT NO REVERSING: Clamped speed lower bound to 0
        let topSpeed = this.config.maxSpeed * (this.boostTimer > 0 ? 1.8 : 1.0);
        this.speed = Math.max(0, Math.min(topSpeed, this.speed));

        // Inertia & Momentum Physics (Fluid Drag + Acceleration)
        let forwardVx = Math.cos(this.angle) * this.speed;
        let forwardVy = Math.sin(this.angle) * this.speed;

        // Blend velocity vectors for drift / momentum
        this.vx = this.vx * 0.92 + forwardVx * 0.08;
        this.vy = this.vy * 0.92 + forwardVy * 0.08;

        this.x += this.vx;
        this.y += this.vy;

        // Map Boundary Clamping
        this.x = Math.max(120, Math.min(MAP_SIZE - 120, this.x));
        this.y = Math.max(120, Math.min(MAP_SIZE - 120, this.y));

        // Dramatic Wave Physics ("跌宕起伏")
        let waveTime = gameTime * 0.03 + this.waveOffset;
        this.wavePitch = Math.sin(waveTime * 1.4 + this.x * 0.003) * 0.14; // Roll tilt
        this.waveScale = 0.93 + Math.cos(waveTime * 1.1 + this.y * 0.003) * 0.09; // Pitch height
    }

    handlePlayerControls() {
        let turnRate = this.config.turnSpeed * (this.turnBoostTimer > 0 ? 2.0 : 1.0);

        // Forward Acceleration (Up, W, Numpad 8)
        if (keys['arrowup'] || keys['w'] || keys['numpad8'] || keys['keyw']) {
            this.speed += 0.045;
        } else {
            this.speed *= 0.985; // Natural water resistance slowdown
        }

        // Turning Left/Right (Left/Right, A/D, Numpad 4/6)
        if (keys['arrowleft'] || keys['a'] || keys['numpad4'] || keys['keya']) {
            this.angle -= turnRate;
        }
        if (keys['arrowright'] || keys['d'] || keys['numpad6'] || keys['keyd']) {
            this.angle += turnRate;
        }
    }

    handleAIControls() {
        // Find closest target
        let target = null;
        let minDist = 999999;
        ships.forEach(other => {
            if (other.team !== this.team && other.hp > 0 && other.stealthTimer <= 0) {
                let d = Math.hypot(other.x - this.x, other.y - this.y);
                if (d < minDist) {
                    minDist = d;
                    target = other;
                }
            }
        });

        if (target) {
            let angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
            // AI tries to align broadside (90 degrees to target angle)
            let desiredAngle = angleToTarget + Math.PI / 2;
            let diff = desiredAngle - this.angle;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));

            if (diff > 0.05) this.angle += this.config.turnSpeed;
            else if (diff < -0.05) this.angle -= this.config.turnSpeed;

            this.speed += 0.025;

            // AI Firing logic
            if (minDist < this.config.range) {
                this.fireBroadside();
                if (Math.random() < 0.008) {
                    this.useSkill(Math.floor(Math.random() * 3));
                }
            }
        } else {
            this.speed += 0.01;
        }
    }

    useSkill(index) {
        if (this.hp <= 0) return;
        let s = this.skills[index];
        if (s && s.cdTimer <= 0) {
            s.cdTimer = s.data.cd;
            s.data.action(this);
            audio.playSkill();
            createParticles(this.x, this.y, 20, '#f39c12');
            if (this.isPlayer) {
                addFloatingText("技能觸發: " + s.data.name, this.x, this.y - 40, '#f39c12');
            }
        }
    }

    triggerBoarding() {
        // Boarding strike logic
        ships.forEach(other => {
            if (other.team !== this.team && other.hp > 0) {
                let d = Math.hypot(other.x - this.x, other.y - this.y);
                if (d < 180) {
                    let dmg = 250;
                    other.takeDamage(dmg, this);
                    createParticles(other.x, other.y, 30, '#e74c3c');
                    addFloatingText("接舷重創! -" + dmg, other.x, other.y - 30, '#e74c3c');
                }
            }
        });
    }

    fireBroadside() {
        if (this.fireCd > 0 || this.hp <= 0) return;
        this.fireCd = this.config.cd;
        audio.playCannon();

        let sideAngles = [this.angle - Math.PI / 2, this.angle + Math.PI / 2];
        let gunsPerSide = Math.ceil(this.config.guns / 2);

        sideAngles.forEach(baseAngle => {
            for (let i = 0; i < gunsPerSide; i++) {
                let offset = (i - gunsPerSide / 2) * 10;
                let spread = (Math.random() - 0.5) * 0.16; // Storm accuracy drift
                let gunAngle = baseAngle + spread;

                let startX = this.x + Math.cos(this.angle) * offset;
                let startY = this.y + Math.sin(this.angle) * offset;

                cannonballs.push(new Cannonball(
                    startX, startY,
                    gunAngle,
                    this.config.range,
                    35 * this.buffDamage,
                    this.team,
                    this.specialAmmo,
                    this
                ));

                // Muzzle flash
                createParticles(startX, startY, 4, '#ff9f43');
            }
        });

        this.buffDamage = 1.0;
        this.specialAmmo = null;
    }

    takeDamage(amount, attacker) {
        if (this.shieldTimer > 0) amount *= 0.5;
        this.hp -= amount;

        if (attacker && attacker.isPlayer) {
            statsDamage += amount;
        }

        if (this.hp <= 0) {
            this.hp = 0;
            if (attacker && attacker.isPlayer) {
                statsKills++;
            }
            createParticles(this.x, this.y, 40, '#e74c3c');
            addFloatingText("沉沒!", this.x, this.y - 30, '#c0392b');
        } else {
            addFloatingText("-" + Math.round(amount), this.x, this.y - 20, this.team === 'blue' ? '#3498db' : '#e74c3c');
        }
    }

    draw(ctx) {
        if (this.sinkingTimer > 120) return; // Completely sunk

        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.hp <= 0) {
            // Sinking visual animation
            ctx.rotate(this.angle + this.sinkingTimer * 0.01);
            ctx.scale(1 - this.sinkingTimer / 120, 1 - this.sinkingTimer / 120);
            ctx.globalAlpha = Math.max(0, 1 - this.sinkingTimer / 120);
        } else {
            // Wave pitching animation ("跌宕起伏")
            ctx.rotate(this.angle + this.wavePitch);
            ctx.scale(this.waveScale, this.waveScale);
        }

        if (this.stealthTimer > 0) ctx.globalAlpha = 0.35;

        // Ironclad Shield Aura
        if (this.shieldTimer > 0) {
            ctx.beginPath();
            ctx.arc(0, 0, 45, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(52, 152, 219, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Hull Geometry (Detailed Age of Sail Battleship)
        let len = 34 + this.config.tier * 4;
        let width = 14 + this.config.tier * 1.8;

        // Wood Hull Body
        ctx.fillStyle = this.team === 'blue' ? '#1f3a60' : '#5c1d24';
        ctx.strokeStyle = this.team === 'blue' ? '#4a90e2' : '#e74c3c';
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.moveTo(len / 2 + 12, 0); // Bow tip
        ctx.quadraticCurveTo(len / 4, -width / 2, -len / 2, -width / 2 + 2); // Starboard curve
        ctx.lineTo(-len / 2 - 4, 0); // Stern
        ctx.lineTo(-len / 2, width / 2 - 2);
        ctx.quadraticCurveTo(len / 4, width / 2, len / 2 + 12, 0); // Port curve
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Wooden Deck & Masts
        ctx.fillStyle = '#8d5b4c';
        ctx.fillRect(-len / 3, -width / 4, len * 0.75, width / 2);

        // Canvas Sails
        ctx.fillStyle = '#f5f6fa';
        ctx.strokeStyle = '#dcdde1';
        ctx.lineWidth = 1;

        // Main & Fore Masts Sails
        ctx.fillRect(-len / 4, -width / 2 - 3, 5, width + 6);
        ctx.fillRect(8, -width / 2 - 5, 6, width + 10);

        // Player Highlight Indicator
        if (this.isPlayer) {
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, len + 10, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();

        // HP Bar Display
        if (this.hp > 0) {
            ctx.save();
            ctx.translate(this.x, this.y - 40);
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(-22, 0, 44, 5);
            ctx.fillStyle = this.team === 'blue' ? '#2ecc71' : '#e74c3c';
            ctx.fillRect(-22, 0, Math.max(0, (this.hp / this.maxHp) * 44), 5);
            ctx.restore();
        }
    }
}


// ==========================================
// 5. CANNONBALLS & PARTICLES SYSTEM
// ==========================================
class Cannonball {
    constructor(x, y, angle, range, damage, team, specialAmmo, owner) {
        this.x = x;
        this.y = y;
        this.speed = 9.5;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.range = range;
        this.damage = damage;
        this.team = team;
        this.specialAmmo = specialAmmo;
        this.owner = owner;
        this.traveled = 0;
        this.altitude = 0;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        let dist = Math.hypot(this.vx, this.vy);
        this.traveled += dist;

        // Arc height simulation (3D trajectory illusion)
        let progress = this.traveled / this.range;
        this.altitude = Math.sin(progress * Math.PI) * 22;

        // Smoke trail particle
        if (Math.random() < 0.6) {
            particles.push({
                x: this.x,
                y: this.y - this.altitude,
                vx: (Math.random() - 0.5) * 1,
                vy: (Math.random() - 0.5) * 1,
                life: 15,
                maxLife: 15,
                color: 'rgba(200, 200, 200, 0.4)',
                size: 3
            });
        }

        // Collision Check
        ships.forEach(s => {
            if (s.team !== this.team && s.hp > 0) {
                let hitDist = Math.hypot(s.x - this.x, s.y - this.y);
                if (hitDist < 28) {
                    s.takeDamage(this.damage, this.owner);
                    if (this.specialAmmo === 'chain') {
                        s.speed *= 0.5; // Chain shot slows target
                        addFloatingText("風帆減速!", s.x, s.y - 30, '#f39c12');
                    }
                    audio.playImpact();
                    createParticles(this.x, this.y, 12, '#e74c3c');
                    this.traveled = this.range + 999; // Expire projectile
                }
            }
        });

        if (this.traveled >= this.range) {
            audio.playSplash();
            createParticles(this.x, this.y, 6, '#3498db');
        }
    }

    draw(ctx) {
        if (this.traveled >= this.range) return;
        ctx.save();
        // Render Cannonball Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();

        // Render Flying Cannonball
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(this.x, this.y - this.altitude, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7,
            life: 20 + Math.random() * 20,
            maxLife: 40,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}

function addFloatingText(text, x, y, color) {
    floatingTexts.push({
        text: text,
        x: x,
        y: y,
        vy: -1.2,
        life: 45,
        color: color
    });
}

            <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-xs text-gray-300 mb-3">

                <div>航速: <b class="text-cyan-400">${st.maxSpeed} 節</b></div>
                <div>舷炮: <b class="text-amber-400">${st.guns * 2} 門</b></div>

function startGame() {
    audio.init();

    document.getElementById('select-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    miniCanvas = document.getElementById('minimapCanvas');
    miniCtx = miniCanvas.getContext('2d');

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Reset Match Variables
    ships = [];
    cannonballs = [];
    particles = [];
    floatingTexts = [];
    statsKills = 0;
    statsDamage = 0;
    matchStartTime = Date.now();

    // Spawn Player
    let playerConfig = SHIP_TIERS.find(s => s.tier === selectedTierNumber);
    player = new Ship(700, MAP_SIZE / 2, 'blue', playerConfig, true);
    ships.push(player);

    // Spawn 9 Friendly AI ships
    for (let i = 0; i < 9; i++) {
        let randTier = SHIP_TIERS[Math.floor(Math.random() * SHIP_TIERS.length)];
        ships.push(new Ship(500 + Math.random() * 400, 300 + i * 320, 'blue', randTier, false));
    }

    // Spawn 10 Enemy AI ships
    for (let i = 0; i < 10; i++) {
        let randTier = SHIP_TIERS[Math.floor(Math.random() * SHIP_TIERS.length)];
        ships.push(new Ship(MAP_SIZE - 700 + Math.random() * 400, 300 + i * 320, 'red', randTier, false));
    }

    // Rain particles init
    rainParticles = [];
    for (let i = 0; i < 450; i++) {
        rainParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: 18 + Math.random() * 22,
            speed: 14 + Math.random() * 8
        });
    }

    // Populate HUD Skill row
    let skillRow = document.getElementById('skill-row');
    skillRow.innerHTML = '';
    player.skills.forEach((s, idx) => {
        let btn = document.createElement('div');
        btn.className = "relative bg-slate-800/80 hover:bg-slate-700/80 border border-amber-500/30 rounded-lg p-2 text-center cursor-pointer transition";
        btn.onclick = () => player.useSkill(idx);
        btn.innerHTML = `
            <span class="block text-[10px] text-amber-400 font-bold">[${idx + 1}]</span>
            <span class="text-xs font-bold text-gray-200 block truncate">${s.data.name}</span>
            <div id="cd-overlay-${idx}" class="cd-overlay hidden">0</div>
        `;
        skillRow.appendChild(btn);
    });

    document.getElementById('player-ship-title').innerText = player.config.name;

    gameRunning = true;
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}


// ==========================================
// 7. MAIN GAME LOOP & RENDERER
// ==========================================
function gameLoop() {
    if (!gameRunning) return;
    gameTime++;

    // Random Lightning Flash System
    if (Math.random() < 0.003) {
        lightningTimer = 12;
        audio.playThunder();
    }
    if (lightningTimer > 0) lightningTimer--;

    // Camera Center Smooth Lerp on Player
    if (player) {
        camera.x += (player.x - canvas.width / 2 - camera.x) * 0.1;
        camera.y += (player.y - canvas.height / 2 - camera.y) * 0.1;
    }

    // World Mouse Position
    mouse.worldX = mouse.x + camera.x;
    mouse.worldY = mouse.y + camera.y;

    // 1. Draw Tempest Ocean Background
    ctx.save();
    ctx.fillStyle = lightningTimer > 0 ? '#1b2a4a' : '#030811';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.translate(-camera.x, -camera.y);

    // Dynamic Storm Ocean Grid Waves
    ctx.strokeStyle = 'rgba(52, 152, 219, 0.08)';
    ctx.lineWidth = 2;
    let waveTime = gameTime * 0.02;
    for (let x = 0; x < MAP_SIZE; x += 180) {
        ctx.beginPath();
        for (let y = 0; y < MAP_SIZE; y += 60) {
            let offset = Math.sin(waveTime + y * 0.008) * 22;
            if (y === 0) ctx.moveTo(x + offset, y);
            else ctx.lineTo(x + offset, y);
        }
        ctx.stroke();
    }

    // Map Outer Boundary
    ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
    ctx.lineWidth = 6;
    ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

    // Player Aiming Arcs Sector Visualization
    if (player && player.hp > 0) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.fillStyle = 'rgba(241, 196, 15, 0.06)';
        ctx.strokeStyle = 'rgba(241, 196, 15, 0.2)';
        ctx.lineWidth = 1;

        // Left & Right Broadside Firing Arcs
        [-Math.PI / 2, Math.PI / 2].forEach(sideAngle => {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, player.config.range, player.angle + sideAngle - 0.4, player.angle + sideAngle + 0.4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        });
        ctx.restore();
    }

    // 2. Update & Draw Ships
    ships.forEach(s => {
        s.update();
        s.draw(ctx);
    });

    // 3. Cannonballs Logic
    for (let i = cannonballs.length - 1; i >= 0; i--) {
        let b = cannonballs[i];
        b.update();
        b.draw(ctx);
        if (b.traveled >= b.range + 1000) {
            cannonballs.splice(i, 1);
        }
    }

    // 4. Particle Effects
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0) particles.splice(i, 1);
    }

    // 5. Floating Text (Damage & Status)
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life--;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 14px "Noto Serif TC"';
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    ctx.restore();

    // 6. Heavy Storm Rain Foreground
    ctx.strokeStyle = 'rgba(174, 217, 224, 0.35)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    rainParticles.forEach(r => {
        r.y += r.speed;
        r.x -= r.speed * 0.3;
        if (r.y > canvas.height) r.y = -20;
        if (r.x < 0) r.x = canvas.width;
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - r.length * 0.3, r.y + r.length);
    });
    ctx.stroke();

    // 7. Custom Aiming Crosshair Cursor
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 14, 0, Math.PI * 2);
    ctx.moveTo(mouse.x - 20, mouse.y); ctx.lineTo(mouse.x + 20, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 20); ctx.lineTo(mouse.x, mouse.y + 20);
    ctx.stroke();

    // 8. Update HUD & Minimap
    updateHUD();
    drawMinimap();

    // Check Match Win/Loss Conditions
    checkMatchEnd();

    requestAnimationFrame(gameLoop);
}


// ==========================================
// 8. HUD & MINIMAP RADAR UPDATES
// ==========================================
function updateHUD() {
    let blueAlive = ships.filter(s => s.team === 'blue' && s.hp > 0).length;
    let redAlive = ships.filter(s => s.team === 'red' && s.hp > 0).length;

    document.getElementById('blue-count').innerText = blueAlive;
    document.getElementById('red-count').innerText = redAlive;

    if (player) {
        let hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
        document.getElementById('hp-bar-fill').style.width = hpPercent + '%';
        document.getElementById('hp-text').innerText = `${Math.ceil(Math.max(0, player.hp))} / ${player.maxHp}`;
        document.getElementById('speed-indicator').innerText = `航速: ${player.speed.toFixed(1)} 節`;

        player.skills.forEach((s, idx) => {
            let overlay = document.getElementById(`cd-overlay-${idx}`);
            if (s.cdTimer > 0) {
                overlay.classList.remove('hidden');
                overlay.innerText = Math.ceil(s.cdTimer / 60) + 's';
            } else {
                overlay.classList.add('hidden');
            }
        });
    }
}

function drawMinimap() {
    miniCtx.clearRect(0, 0, 160, 160);
    let scale = 160 / MAP_SIZE;

    ships.forEach(s => {
        if (s.hp > 0) {
            miniCtx.fillStyle = s.team === 'blue' ? (s.isPlayer ? '#f1c40f' : '#3498db') : '#e74c3c';
            miniCtx.beginPath();
            miniCtx.arc(s.x * scale, s.y * scale, s.isPlayer ? 4.5 : 2.5, 0, Math.PI * 2);
            miniCtx.fill();
        }
    });
}

function checkMatchEnd() {
    let blueAlive = ships.filter(s => s.team === 'blue' && s.hp > 0).length;
    let redAlive = ships.filter(s => s.team === 'red' && s.hp > 0).length;

    if (blueAlive === 0 || redAlive === 0 || (player && player.hp <= 0)) {
        gameRunning = false;
        let isVictory = redAlive === 0 && player.hp > 0;

        let modal = document.getElementById('game-over-modal');
        let title = document.getElementById('game-over-title');
        let desc = document.getElementById('game-over-desc');

        if (isVictory) {
            title.innerText = "輝 煌 勝 利";
            title.className = "text-4xl font-black mb-2 tracking-widest text-yellow-400 drop-shadow";
            desc.innerText = "敵方艦隊已全數沉入暴風雨汪洋！";
        } else {
            title.innerText = "戰 敗 沉 沒";
            title.className = "text-4xl font-black mb-2 tracking-widest text-rose-500 drop-shadow";
            desc.innerText = "您的艦隊在巨浪暴風雨中覆滅...";
        }

        let elapsedSecs = Math.floor((Date.now() - matchStartTime) / 1000);
        let mins = Math.floor(elapsedSecs / 60).toString().padStart(2, '0');
        let secs = (elapsedSecs % 60).toString().padStart(2, '0');

        document.getElementById('stat-kills').innerText = statsKills;
        document.getElementById('stat-damage').innerText = Math.round(statsDamage);
        document.getElementById('stat-time').innerText = `${mins}:${secs}`;

        modal.classList.remove('hidden');
    }
}

function returnToMenu() {
    document.getElementById('game-over-modal').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('select-screen').classList.remove('hidden');
}

// Window load trigger
window.onload = () => {
    initSelectScreen();
};
</script>
</body>
</html>
